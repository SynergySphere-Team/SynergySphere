name: Build Mobile Releases (iOS IPA & Android APK)

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Cloud Backend API URL (e.g. https://synergysphere-api.onrender.com/api)'
        required: true
        default: 'https://synergysphere-api.onrender.com/api'
      platform:
        description: 'Target mobile platform to build'
        required: true
        type: choice
        default: 'both'
        options:
          - both
          - ios
          - android

jobs:
  build-ios-ipa:
    name: Build iOS .ipa (sign with Sideloadly)
    if: ${{ inputs.platform == 'both' || inputs.platform == 'ios' || github.event.inputs.platform == '' }}
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Configure Production Cloud API URL
        working-directory: ./mobile
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ inputs.api_url }}" > .env
          cat .env

      - name: Prebuild native iOS project via Expo
        working-directory: ./mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
          IOS_BUILD_NUMBER: ${{ github.run_number }}
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ./mobile/ios
        run: pod install

      - name: Compile Release .app for Sideloadly
        working-directory: ./mobile/ios
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
          NODE_ENV: production
        run: |
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath /tmp/SynergySphereDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package unsigned .ipa for Sideloadly
        working-directory: ./mobile/ios
        run: |
          rm -rf Payload SynergySphere-unsigned.ipa
          mkdir -p Payload
          APP_PATH=$(find /tmp/SynergySphereDerivedData/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Compiled .app bundle not found!"
            exit 1
          fi
          cp -R "$APP_PATH" Payload/
          zip -qry SynergySphere-unsigned.ipa Payload
          unzip -t SynergySphere-unsigned.ipa
          if unzip -l SynergySphere-unsigned.ipa | grep -q 'Payload/[^/]*/_CodeSignature/'; then
            echo "Error: the IPA must be unsigned so Sideloadly can sign it for the target phone."
            exit 1
          fi

      - name: Upload SynergySphere-unsigned.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SynergySphere-iOS-IPA
          path: mobile/ios/SynergySphere-unsigned.ipa
          retention-days: 30

  build-android-apk:
    name: Build Standalone Android .apk
    if: ${{ inputs.platform == 'both' || inputs.platform == 'android' || github.event.inputs.platform == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Configure Production Cloud API URL
        working-directory: ./mobile
        run: |
          echo "EXPO_PUBLIC_API_URL=${{ inputs.api_url }}" > .env
          cat .env

      - name: Prebuild native Android project via Expo
        working-directory: ./mobile
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          EXPO_NO_TELEMETRY: '1'
        run: npx expo prebuild --platform android --clean --no-install

      - name: Load Android release signing key when configured
        id: android-signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Android release keystore is configured. This APK can be installed as a first-time install, but it cannot reliably update an existing SynergySphere installation."
            exit 0
          fi
          KEYSTORE_PATH="$RUNNER_TEMP/synergysphere-release.keystore"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "keystore_path=$KEYSTORE_PATH" >> "$GITHUB_OUTPUT"

      - name: Assemble Release APK via Gradle
        working-directory: ./mobile/android
        env:
          EXPO_PUBLIC_API_URL: ${{ inputs.api_url }}
          NODE_ENV: production
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.android-signing.outputs.configured }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a \
              -Pandroid.injected.signing.store.file="${{ steps.android-signing.outputs.keystore_path }}" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          else
            ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
          fi
          cp app/build/outputs/apk/release/app-release.apk ./SynergySphere.apk

      - name: Verify Android APK signature
        working-directory: ./mobile/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$APKSIGNER" ]; then
            echo "Error: apksigner was not found in the Android SDK."
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs SynergySphere.apk

      - name: Upload SynergySphere.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SynergySphere-Android-APK
          path: mobile/android/SynergySphere.apk
          retention-days: 30
